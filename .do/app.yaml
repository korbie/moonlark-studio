# ============================================================================
# DigitalOcean App Platform spec for Moonlark Studio
# ----------------------------------------------------------------------------
# One app, two services sharing one domain:
#   - storefront (Next.js) serves everything at "/"
#   - backend (Medusa) serves the API/admin paths (/store, /admin, /auth,
#     /hooks, /health, /app)
#
# Create the app with:
#   doctl apps create --spec .do/app.yaml
# Update it with:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Everything marked PLACEHOLDER must be filled in. SECRET values should be set
# in the DO dashboard or via `doctl`, not committed.
#
# Data services are EXTERNAL (free tiers): Neon (Postgres), Upstash (Redis,
# optional), Cloudflare R2 (images). That's why no DO database is defined here.
# ============================================================================
name: moonlark-studio
region: nyc

# Point your domain here once you own it (and configure DNS at your registrar
# or Cloudflare). Remove this block to launch on the default ondigitalocean.app
# URL first.
domains:
  - domain: moonlarkstudio.com
    type: PRIMARY
  - domain: www.moonlarkstudio.com
    type: ALIAS

ingress:
  rules:
    # Medusa backend paths
    - match: { path: { prefix: /store } }
      component: { name: backend }
    - match: { path: { prefix: /admin } }
      component: { name: backend }
    - match: { path: { prefix: /auth } }
      component: { name: backend }
    - match: { path: { prefix: /hooks } }
      component: { name: backend }
    - match: { path: { prefix: /health } }
      component: { name: backend }
    - match: { path: { prefix: /app } }
      component: { name: backend }
    # Everything else -> storefront
    - match: { path: { prefix: / } }
      component: { name: storefront }

services:
  # --------------------------------------------------------------------------
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    # Replace with your repo. Also supports `gitlab:` or a generic `git:` block.
    github:
      repo: YOUR_GITHUB_USER/moonlark-studio
      branch: main
      deploy_on_push: true
    http_port: 9000
    # ~$12/mo. Medusa is happier with 1GB; 0.5GB can OOM.
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_NEON_POSTGRES_URL
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: "" # optional: PLACEHOLDER_UPSTASH_REDIS_URL (rediss://...)
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_RANDOM_SECRET
      - key: COOKIE_SECRET
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_RANDOM_SECRET
      - key: STORE_CORS
        scope: RUN_TIME
        value: https://moonlarkstudio.com,https://www.moonlarkstudio.com
      - key: ADMIN_CORS
        scope: RUN_TIME
        value: https://moonlarkstudio.com
      - key: AUTH_CORS
        scope: RUN_TIME
        value: https://moonlarkstudio.com,https://www.moonlarkstudio.com
      - key: S3_FILE_URL
        scope: RUN_TIME
        value: PLACEHOLDER_R2_PUBLIC_URL
      - key: S3_ENDPOINT
        scope: RUN_TIME
        value: PLACEHOLDER_R2_ENDPOINT
      - key: S3_BUCKET
        scope: RUN_TIME
        value: moonlark-media
      - key: S3_REGION
        scope: RUN_TIME
        value: auto
      - key: S3_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_R2_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_R2_SECRET_ACCESS_KEY
      - key: STRIPE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_STRIPE_WEBHOOK_SECRET

  # --------------------------------------------------------------------------
  - name: storefront
    dockerfile_path: storefront/Dockerfile
    source_dir: storefront
    github:
      repo: YOUR_GITHUB_USER/moonlark-studio
      branch: main
      deploy_on_push: true
    http_port: 8000
    # ~$5/mo
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      # NEXT_PUBLIC_* are read at build time, so they need BUILD scope too.
      - key: MEDUSA_BACKEND_URL
        scope: RUN_AND_BUILD_TIME
        value: https://moonlarkstudio.com
      - key: NEXT_PUBLIC_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://moonlarkstudio.com
      - key: NEXT_PUBLIC_DEFAULT_REGION
        scope: RUN_AND_BUILD_TIME
        value: us
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: PLACEHOLDER_PUBLISHABLE_KEY
      - key: NEXT_PUBLIC_STRIPE_KEY
        scope: RUN_AND_BUILD_TIME
        value: PLACEHOLDER_STRIPE_PUBLISHABLE_KEY
      - key: REVALIDATE_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: PLACEHOLDER_RANDOM_SECRET
